
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header}">
</head>

<body>

<!-- Navbar dùng chung -->
<div th:replace="~{fragments/navbar :: navbar}">
</div>


<div class="container mt-4 mb-5">

    <!-- Tiêu đề + nút thêm -->
    <div class="d-flex flex-column flex-md-row
                justify-content-between align-items-md-center
                mb-4 gap-2">

        <h1 class="mb-0"
            th:text="#{category.list}">
            Danh sách danh mục
        </h1>

        <a href="/categories/create"
           class="btn btn-primary"
           th:text="#{category.add}">
            + Thêm danh mục
        </a>

    </div>


    <!-- Bảng danh mục -->
    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-dark">
            <tr>

                <th th:text="#{category.id}">
                    ID
                </th>

                <th th:text="#{category.name}">
                    Tên danh mục
                </th>

                <th th:text="#{category.action}">
                    Thao tác
                </th>

            </tr>
            </thead>


            <tbody>

            <tr th:each="category : ${categories}">

                <td th:text="${category.id}">
                    1
                </td>

                <td th:text="${category.name}">
                    Áo
                </td>

                <td>

                    <div class="d-flex flex-wrap gap-1">

                        <a th:href="@{/categories/edit/{id}(id=${category.id})}"
                           class="btn btn-warning btn-sm"
                           th:text="#{category.edit}">
                            Sửa
                        </a>

                        <a th:href="@{/categories/delete/{id}(id=${category.id})}"
                           class="btn btn-danger btn-sm"
                           th:text="#{category.delete}">
                            Xóa
                        </a>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- Footer dùng chung -->
<div th:replace="~{fragments/footer :: footer}">
</div>

</body>
</html>
