<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Category Management</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>
<div class="position-absolute"
     style="top: 10px; right: 10px;">

    <span th:text="#{language}">
        Ngôn ngữ
    </span>:

    <a href="/language?lang=vi"
       class="btn btn-outline-primary btn-sm">
        Tiếng Việt
    </a>

    <a href="/language?lang=en"
       class="btn btn-outline-secondary btn-sm">
        English
    </a>
</div>
<div class="container mt-5">

    <h1 class="mb-4" th:text="#{category.title}">
        Danh sách danh mục
    </h1>

    <a href="/categories/create"
       class="btn btn-primary mb-3"
       th:text="#{category.add}">
        + Thêm danh mục
    </a>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">
        <tr>
            <th th:text="#{product.id}">ID</th>
            <th th:text="#{category.name}">Tên danh mục</th>
            <th th:text="#{product.action}">Thao tác</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="category : ${categories}">

            <td th:text="${category.id}"></td>

            <td th:text="${category.name}"></td>

            <td>

                <a th:href="@{/categories/edit/{id}(id=${category.id})}"
                   class="btn btn-warning btn-sm"
                   th:text="#{product.edit}">
                    Sửa
                </a>

                <a th:href="@{/categories/delete/{id}(id=${category.id})}"
                   class="btn btn-danger btn-sm"
                   th:text="#{product.delete}">
                    Xóa
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
