<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}">
</div>


<div class="container mt-4 mb-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <!-- Thêm -->
            <h1 class="mb-4"
                th:if="${product.id == null}"
                th:text="#{product.add}">
                Thêm sản phẩm
            </h1>

            <!-- Sửa -->
            <h1 class="mb-4"
                th:unless="${product.id == null}"
                th:text="#{product.edit.title}">
                Sửa sản phẩm
            </h1>


            <form th:action="${product.id == null}
                    ? @{/products/create}
                    : @{/products/edit/{id}(id=${product.id})}"
                  th:object="${product}"
                  method="post"
                  enctype="multipart/form-data">


                <!-- Tên sản phẩm -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{product.name}">
                        Tên sản phẩm
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>

                </div>


                <!-- Giá -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{product.price}">
                        Giá
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{price}"
                           min="0"
                           required>

                </div>


                <!-- Số lượng -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{product.quantity}">
                        Số lượng
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{quantity}"
                           min="0"
                           required>

                </div>


                <!-- Danh mục -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{product.category}">
                        Danh mục
                    </label>

                    <select name="categoryId"
                            class="form-select"
                            required>

                        <option value=""
                                th:text="#{product.category.choose}">
                            -- Chọn danh mục --
                        </option>

                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"
                                th:selected="${product.category != null
                                    and product.category.id == category.id}">
                        </option>

                    </select>

                </div>


                <!-- Ảnh sản phẩm -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{product.image}">
                        Ảnh sản phẩm
                    </label>

                    <input type="file"
                           class="form-control"
                           name="image"
                           accept="image/*">

                </div>


                <!-- Hiển thị ảnh hiện tại khi sửa -->
                <div class="mb-3"
                     th:if="${product.imageUrl != null}">

                    <label class="form-label"
                           th:text="#{product.currentImage}">
                        Ảnh hiện tại
                    </label>

                    <div>
                        <img th:src="${product.imageUrl}"
                             class="img-thumbnail"
                             style="width: 120px;
                                    height: 120px;
                                    object-fit: cover;">
                    </div>

                </div>


                <!-- Nút -->
                <button type="submit"
                        class="btn btn-primary"
                        th:text="#{product.save}">
                    Lưu
                </button>

                <a href="/products"
                   class="btn btn-secondary"
                   th:text="#{product.back}">
                    Quay lại
                </a>

            </form>

        </div>

    </div>

</div>


<div th:replace="~{fragments/footer :: footer}">
</div>

</body>
</html>
