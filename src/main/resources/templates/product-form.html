<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Thêm sản phẩm</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>
<div class="position-absolute"
     style="top: 10px; right: 10px;">

    <span th:text="#{language}">
        Ngôn ngữ
    </span>:

    <a href="/language?lang=vi"
       class="btn btn-outline-primary btn-sm">
        Tiếng Việt
    </a>

    <a href="/language?lang=en"
       class="btn btn-outline-secondary btn-sm">
        English
    </a>
</div>

<div class="container mt-5">

    <h1 class="mb-4"
        th:if="${product.id == null}"
        th:text="#{product.add}">
        Thêm sản phẩm
    </h1>

    <h1 class="mb-4"
        th:unless="${product.id == null}"
        th:text="#{product.edit.title}">
        Sửa sản phẩm
    </h1>
    <form th:action="${product.id == null}
              ? @{/products/create}
              : @{/products/edit/{id}(id=${product.id})}"
          th:object="${product}"
          method="post">

        <!-- Tên sản phẩm -->
        <div class="mb-3">

            <label class="form-label"
                   th:text="#{product.name}">
                Tên sản phẩm
            </label>
            <input type="text"
                   class="form-control"
                   th:field="*{name}"
                   required>

        </div>

        <!-- Giá -->
        <div class="mb-3">

            <label class="form-label"
                   th:text="#{product.price}">
                Giá
            </label>
            <input type="number"
                   class="form-control"
                   th:field="*{price}"
                   min="0"
                   required>

        </div>

        <!-- Số lượng -->
        <div class="mb-3">

            <label class="form-label"
                   th:text="#{product.quantity}">
                Số lượng
            </label>

            <input type="number"
                   class="form-control"
                   th:field="*{quantity}"
                   min="0"
                   required>

        </div>

        <!-- Danh mục -->
        <div class="mb-3">

            <label class="form-label"
                   th:text="#{product.category}">
                Danh mục
            </label>

            <select name="categoryId"
                    class="form-select"
                    required>

                <option value="">
                    -- Chọn danh mục --
                </option>

                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                </option>

            </select>

        </div>

        <button type="submit"
                class="btn btn-primary"
                 th:text="#{product.save}">
            Thêm sản phẩm
        </button>

        <a href="/products"
           class="btn btn-secondary"
           th:text="#{product.back}">
            Quay lại
        </a>

    </form>

</div>

</body>
</html>
