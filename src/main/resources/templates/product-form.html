
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header}">
</head>

<body>

<!-- Navbar dùng chung -->
<div th:replace="~{fragments/navbar :: navbar}">
</div>


<!-- Nội dung Form -->
<div class="container mt-4 mb-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <!-- Tiêu đề khi thêm -->
            <h1 class="mb-4"
                th:if="${product.id == null}"
                th:text="#{product.add}">
                Thêm sản phẩm
            </h1>

            <!-- Tiêu đề khi sửa -->
            <h1 class="mb-4"
                th:unless="${product.id == null}"
                th:text="#{product.edit.title}">
                Sửa sản phẩm
            </h1>


            <form th:action="${product.id == null}
                    ? @{/products/create}
                    : @{/products/edit/{id}(id=${product.id})}"
                  th:object="${product}"
                  method="post">


                <!-- Tên sản phẩm -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{product.name}">
                        Tên sản phẩm
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>

                </div>


                <!-- Giá -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{product.price}">
                        Giá
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{price}"
                           min="0"
                           required>

                </div>


                <!-- Số lượng -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{product.quantity}">
                        Số lượng
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{quantity}"
                           min="0"
                           required>

                </div>


                <!-- Danh mục -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{product.category}">
                        Danh mục
                    </label>

                    <select name="categoryId"
                            class="form-select"
                            required>

                        <option value=""
                                th:text="#{product.category.choose}">
                            -- Chọn danh mục --
                        </option>

                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"
                                th:selected="${product.category != null
                                    and product.category.id == category.id}">
                        </option>

                    </select>

                </div>


                <!-- Nút lưu -->
                <button type="submit"
                        class="btn btn-primary"
                        th:text="#{product.save}">
                    Lưu
                </button>


                <!-- Quay lại -->
                <a href="/products"
                   class="btn btn-secondary"
                   th:text="#{product.back}">
                    Quay lại
                </a>

            </form>

        </div>

    </div>

</div>


<!-- Footer dùng chung -->
<div th:replace="~{fragments/footer :: footer}">
</div>
