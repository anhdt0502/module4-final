<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Category Form</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4"
        th:text="${category.id == null
                  ? 'Thêm danh mục'
                  : 'Sửa danh mục'}">
        Thêm danh mục
    </h1>

    <form th:action="${category.id == null}
                  ? @{/categories/create}
                  : @{/categories/edit/{id}(id=${category.id})}"
          th:object="${category}"
          method="post">

        <div class="mb-3">

            <label class="form-label">
                Tên danh mục
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{name}"
                   required>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Lưu
        </button>

        <a href="/categories"
           class="btn btn-secondary">
            Quay lại
        </a>

    </form>

</div>

</body>
</html>
