
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header}">
</head>

<body>

<!-- Navbar dùng chung -->
<div th:replace="~{fragments/navbar :: navbar}">
</div>


<div class="container mt-4 mb-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <!-- Thêm danh mục -->
            <h1 class="mb-4"
                th:if="${category.id == null}"
                th:text="#{category.add}">
                Thêm danh mục
            </h1>

            <!-- Sửa danh mục -->
            <h1 class="mb-4"
                th:unless="${category.id == null}"
                th:text="#{category.edit.title}">
                Sửa danh mục
            </h1>


            <form th:action="${category.id == null}
                    ? @{/categories/create}
                    : @{/categories/edit/{id}(id=${category.id})}"
                  th:object="${category}"
                  method="post">

                <!-- Tên danh mục -->
                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{category.name}">
                        Tên danh mục
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>

                </div>


                <!-- Nút lưu -->
                <button type="submit"
                        class="btn btn-primary"
                        th:text="#{category.save}">
                    Lưu
                </button>

                <!-- Quay lại -->
                <a href="/categories"
                   class="btn btn-secondary"
                   th:text="#{category.back}">
                    Quay lại
                </a>

            </form>

        </div>

    </div>

</div>


<!-- Footer dùng chung -->
<div th:replace="~{fragments/footer :: footer}">
</div>

</body>
</html>
