
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header}">
</head>

<body>

<!-- Navbar dùng chung -->
<div th:replace="~{fragments/navbar :: navbar}">
</div>


<!-- Nội dung Products -->
<div class="container mt-4">

    <div class="d-flex flex-column flex-md-row
                justify-content-between align-items-md-center
                mb-4 gap-2">

        <h1 class="mb-0"
            th:text="#{product.list}">
            Danh sách sản phẩm
        </h1>

        <a href="/products/create"
           class="btn btn-primary"
           th:text="#{product.add}">
            + Thêm sản phẩm
        </a>

    </div>


    <!-- Responsive table -->
    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-dark">
            <tr>

                <th th:text="#{product.id}">
                    ID
                </th>
                <th th:text="#{product.image}">
                    Ảnh
                </th>

                <th th:text="#{product.name}">
                    Tên sản phẩm
                </th>


                <th th:text="#{product.price}">
                    Giá
                </th>

                <th th:text="#{product.quantity}">
                    Số lượng
                </th>

                <th th:text="#{product.category}">
                    Danh mục
                </th>

                <th th:text="#{product.action}">
                    Thao tác
                </th>

                <th th:text="#{product.cart}">
                    Giỏ hàng
                </th>

            </tr>
            </thead>


            <tbody>

            <tr th:each="product : ${products}">

                <td th:text="${product.id}">
                    1
                </td>
                <td>
                    <img th:if="${product.imageUrl != null}"
                         th:src="${product.imageUrl}"
                         class="img-thumbnail"
                         style="width: 70px;
                height: 70px;
                object-fit: cover;">

                    <span th:unless="${product.imageUrl != null}"
                          class="text-muted">
        -
    </span>
                </td>

                <td th:text="${product.name}">
                    Áo thun
                </td>

                <td th:text="${product.price}">
                    250000
                </td>

                <td th:text="${product.quantity}">
                    10
                </td>

                <td th:text="${product.category != null
                        ? product.category.name
                        : 'Chưa có'}">
                    Chưa có
                </td>


                <!-- Thao tác -->
                <td>

                    <div class="d-flex flex-wrap gap-1">

                        <a th:href="@{/products/edit/{id}(id=${product.id})}"
                           class="btn btn-warning btn-sm"
                           th:text="#{product.edit}">
                            Sửa
                        </a>

                        <a th:href="@{/products/delete/{id}(id=${product.id})}"
                           class="btn btn-danger btn-sm"
                           th:text="#{product.delete}">
                            Xóa
                        </a>

                    </div>

                </td>


                <!-- Giỏ hàng -->
                <td>

                    <form th:action="@{/cart/add}"
                          method="post">

                        <input type="hidden"
                               name="productId"
                               th:value="${product.id}">

                        <button type="submit"
                                class="btn btn-success btn-sm"
                                th:text="#{product.addToCart}">
                            Thêm vào giỏ
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- Footer dùng chung -->
<div th:replace="~{fragments/footer :: footer}">
</div>

</body>
</html>
