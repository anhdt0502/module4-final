<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Product Management</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>
<div class="position-absolute top-0 end-0 mt-2 me-2">
    <span th:text="#{language}">Ngôn ngữ</span>:

    <a href="/language?lang=vi"
       class="btn btn-outline-primary btn-sm">
        Tiếng Việt
    </a>

    <a href="/language?lang=en"
       class="btn btn-outline-secondary btn-sm">
        English
    </a>
</div>

<div class="container mt-5">

    <h1 class="mb-4">Danh sách sản phẩm</h1>
    <a href="/products/create"
       class="btn btn-primary mb-3"
       th:text="#{product.add}">
        + Thêm sản phẩm
    </a>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">
        <tr>
            <th th:text="#{product.id}">ID</th>
            <th th:text="#{product.name}">Tên sản phẩm</th>
            <th th:text="#{product.price}">Giá</th>
            <th th:text="#{product.quantity}">Số lượng</th>
            <th th:text="#{product.category}">Danh mục</th>
            <th th:text="#{product.action}">Thao tác</th>
            <th>Giỏ hàng</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="product : ${products}">


            <td th:text="${product.id}"></td>

            <td th:text="${product.name}"></td>

            <td th:text="${product.price}"></td>

            <td th:text="${product.quantity}"></td>

            <td th:text="${product.category != null ? product.category.name : 'Chưa có'}"></td>
            <td>

                <a th:href="@{/products/edit/{id}(id=${product.id})}"
                   class="btn btn-warning btn-sm"
                   th:text="#{product.edit}">
                    Sửa
                </a>

                <a th:href="@{/products/delete/{id}(id=${product.id})}"
                   class="btn btn-danger btn-sm"
                   th:text="#{product.delete}">
                    Xóa
                </a>

            </td>
            <td>
                <form th:action="@{/cart/add}"
                      method="post">

                    <input type="hidden"
                           name="productId"
                           th:value="${product.id}">

                    <button type="submit"
                            class="btn btn-success btn-sm">
                        Thêm vào giỏ
                    </button>

                </form>
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
